# PIA2: PHP 7.4.33-pl2, Windows/IIS FastCGI, NTS x64 only.
# This workflow builds from pinned third-party backport sources. It is NOT a security certification.
name: PIA2 PHP 7.4 NTS x64
run-name: PHP 7.4.33-pl2 NTS x64 (release=${{ inputs.release }})

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (instead of artifacts only)
        type: boolean
        default: false

env:
  PHP_SRC_REPO: remicollet/php-src-security
  PHP_SRC_SHA: 239d8122851d31a5e7350f77b32810e58d56c1f4
  BUILDER_SHA: 5f63433eb2bda2ca8d0d970fe487be84f7ab195c
  BASE_VERSION: '7.4.33'
  VERSION_SUFFIX: '-pl2'
  SRC_DIR: php-src

permissions:
  contents: read

jobs:
  verify:
    name: Verify security backports
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout our reviewed workflow and verification files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check pinned source against versions.json
        shell: bash
        run: |
          test "$(jq -r '.["7.4"].php_src_repo' versions.json)" = "$PHP_SRC_REPO"
          test "$(jq -r '.["7.4"].php_src_sha' versions.json)" = "$PHP_SRC_SHA"
          test "$(jq -r '.["7.4"].base_version' versions.json)" = "$BASE_VERSION"
          test "$(jq -r '.["7.4"].patch_level' versions.json)" = "2"
      - name: Compare patches with official PHP sources
        env:
          BRANCH: '7.4'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/verify_backports.py "$BRANCH"
          cat "verification/$BRANCH.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  build:
    name: Windows NTS x64 build and tests
    needs: verify
    runs-on: windows-2022
    steps:
      - name: Git line ending settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout pinned official PHP Windows builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: php/php-windows-builder
          ref: ${{ env.BUILDER_SHA }}
          path: builder
      - name: Checkout pinned patched PHP sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.PHP_SRC_REPO }}
          ref: ${{ env.PHP_SRC_SHA }}
          path: ${{ env.SRC_DIR }}

      # NO Oracle SDK download. NO extra_configure from versions.json.
      # These flags disable extensions not needed for the planned IIS/MSSQL installation.
      # If PIA2 uses COM automation, PostgreSQL, Firebird, SNMP or Enchant,
      # remove the corresponding --disable/--without option BEFORE building.
      - name: Disable unnecessary optional PHP extensions
        shell: pwsh
        run: |
          $bat = 'builder/php/BuildPhp/config/vc15/x64/config.nts.bat'
          $content = Get-Content $bat -Raw
          if (-not $content.Contains(' %*')) { throw "Expected build options not found: $bat" }
          $disabled = @(
            '--disable-com-dotnet',
            '--without-pgsql',
            '--without-pdo-pgsql',
            '--without-pdo-firebird',
            '--without-snmp',
            '--without-enchant',
            '--without-oci8',
            '--without-oci8-12c',
            '--without-pdo-oci'
          )
          # Replace the builder's explicit COM activation rather than passing conflicting flags.
          $content = $content.Replace('"--enable-com-dotnet=shared" ', '')
          $flags = ($disabled | ForEach-Object { '"' + $_ + '"' }) -join ' '
          $content = $content.Replace(' %*', " $flags %*")
          Set-Content -Path $bat -Value $content -NoNewline
          Write-Host "Final configure command:"
          Get-Content $bat

      - name: Set 7.4.33-pl2 version without altering the API/ABI
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          $version = "$env:BASE_VERSION$env:VERSION_SUFFIX"
          [int]$major, [int]$minor, [int]$release = $env:BASE_VERSION.Split('.')
          $patches = @(
            @{ File = 'configure.ac'; From = 'AC_INIT\(\[PHP\],\[[^\]]+\]'; To = "AC_INIT([PHP],[$version]" },
            @{ File = 'main/php_version.h'; From = "#define PHP_MAJOR_VERSION $major\b"; To = "#define PHP_MAJOR_VERSION $major" },
            @{ File = 'main/php_version.h'; From = "#define PHP_MINOR_VERSION $minor\b"; To = "#define PHP_MINOR_VERSION $minor" },
            @{ File = 'main/php_version.h'; From = '#define PHP_RELEASE_VERSION \d+'; To = "#define PHP_RELEASE_VERSION $release" },
            @{ File = 'main/php_version.h'; From = '#define PHP_EXTRA_VERSION "[^"]*"'; To = "#define PHP_EXTRA_VERSION `"$env:VERSION_SUFFIX`"" },
            @{ File = 'main/php_version.h'; From = '#define PHP_VERSION "[^"]*"'; To = "#define PHP_VERSION `"$version`"" },
            @{ File = 'main/php_version.h'; From = '#define PHP_VERSION_ID \d+'; To = "#define PHP_VERSION_ID $($major * 10000 + $minor * 100 + $release)" }
          )
          foreach ($p in $patches) {
            $content = Get-Content $p.File -Raw
            $count = ([regex]::Matches($content, $p.From)).Count
            if ($count -ne 1) { throw "$($p.File): '$($p.From)' matched $count times" }
            Set-Content $p.File ([regex]::Replace($content, $p.From, $p.To)) -NoNewline
          }
          git diff --check
          git diff

      - name: Compile PHP
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        env:
          SBOM: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\builder\php\BuildPhp" -Force
          Invoke-PhpBuild -Arch x64 -Ts nts

      - name: Official PHP smoke tests (PIA2 extension profile)
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          # The pinned upstream builder requires COM, Enchant and PostgreSQL in
          # its standard smoke-test baseline, although our build omits them.
          # Adjust ONLY the required-module list in this ephemeral checkout.
          # All other upstream checks (php -v / -m / -i) remain unchanged.
          $moduleList = Join-Path $env:GITHUB_WORKSPACE 'builder/php/BuildPhp/config/smoke_test_modules'
          $excluded = @('com_dotnet', 'enchant', 'pdo_pgsql', 'pgsql')
          $baseline = @(Get-Content -LiteralPath $moduleList)
          foreach ($module in $excluded) {
            $matches = @($baseline | Where-Object { $_.Trim() -ieq $module })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one '$module' in official smoke-test baseline, found $($matches.Count)"
            }
          }
          $remaining = @($baseline | Where-Object { $_.Trim() -notin $excluded })
          Set-Content -LiteralPath $moduleList -Value $remaining -Encoding ascii
          Write-Host "PIA2 smoke-test profile: excluded $($excluded -join ', ')"
          $retainedNames = @($remaining | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          Write-Host "All other $($retainedNames.Count) official required modules are still checked."
          Import-Module "$env:GITHUB_WORKSPACE\builder\php\BuildPhp" -Force
          Invoke-PhpSmokeTests -ArtifactsDirectory artifacts -Arch x64 -Ts nts

      - name: Verify version, FastCGI and PHP extensions
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}/artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem 'php-7.4.33-pl2-nts-Win32-*-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'NTS x64 ZIP not found' }
          $dir = Join-Path $env:RUNNER_TEMP 'pia2-php'
          Expand-Archive $zip.FullName -DestinationPath $dir
          foreach ($required in @('php.exe', 'php-cgi.exe', 'php7.dll')) {
            if (-not (Test-Path (Join-Path $dir $required))) { throw "Missing $required" }
          }
          $php = Join-Path $dir 'php.exe'
          $version = (& $php -n -r 'echo PHP_VERSION;').Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '7.4.33-pl2') { throw "Unexpected PHP version: $version" }
          $zts = (& $php -n -r 'echo PHP_ZTS;').Trim()
          if ($LASTEXITCODE -ne 0 -or $zts -ne '0') { throw "Not an NTS build: PHP_ZTS=$zts" }
          $forbidden = @('php_com_dotnet.dll','php_pgsql.dll','php_pdo_pgsql.dll',
            'php_pdo_firebird.dll','php_snmp.dll','php_enchant.dll','php_pdo_oci.dll')
          foreach ($dll in $forbidden) {
            if (Test-Path (Join-Path $dir "ext\$dll")) { throw "Unwanted extension: $dll" }
          }
          if (Get-ChildItem (Join-Path $dir 'ext') -Filter 'php_oci8*.dll') { throw 'Unwanted Oracle extension' }
          # Load the remaining shared extensions as in the original workflow.
          $loadArgs = @()
          foreach ($dll in Get-ChildItem (Join-Path $dir 'ext') -Filter 'php_*.dll') {
            $directive = if ($dll.Name -eq 'php_opcache.dll') { 'zend_extension' } else { 'extension' }
            $loadArgs += '-d', "$directive=$($dll.FullName)"
          }
          $out = (& $php -n @loadArgs -d opcache.enable_cli=1 -r "echo opcache_get_status() === false ? 'KO' : 'ok';" 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $out -ne 'ok') { throw "Extension loading test failed: $out" }
          Write-Host "Verified: PHP $version NTS x64 and $($loadArgs.Count / 2) extensions"

      - name: Upload tested binaries and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pia2-php-7.4.33-pl2-build
          path: ${{ env.SRC_DIR }}/artifacts/*
          if-no-files-found: error
          retention-days: 30

  package:
    name: Checksums, provenance and optional release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pia2-php-7.4.33-pl2-build
          path: dist
      - name: Create SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.json' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Attest binaries (public repositories only)
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Upload ready-to-use package and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pia2-php-7.4.33-pl2-verified
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish a GitHub release (optional)
        if: ${{ inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          PIA2: PHP 7.4.33-pl2 NTS x64 for Windows IIS/FastCGI.
          Unofficial security backport. Not certified by PHP.net or BSI.
          Source: ${PHP_SRC_REPO}@${PHP_SRC_SHA}
          Builder: php/php-windows-builder@${BUILDER_SHA}
          Built and tested: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Contains ZIP, SHA256SUMS and available SBOM files. Microsoft SQLSRV PHP drivers are NOT included.
          EOF
          gh release create "pia2-php-7.4.33-pl2-run-${GITHUB_RUN_ID}" dist/* \
            --target "$GITHUB_SHA" \
            --title 'PIA2 PHP 7.4.33-pl2 NTS x64' \
            --notes-file release-notes.md
